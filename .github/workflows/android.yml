name: Android engine

# SS14.Android (engine): Android build of the engine that the SS14.Android launcher
# (lAstronautl/SS14.Launcher, branch SS14.Android) downloads. The launcher itself is not here.
#
# Release android-engine-v<engine version>:
#   Robust.Client_android.zip (+ .sha256)   managed engine + Resources + runtimeconfig
#   Robust.Client_android-aot-arm64.zip     precompiled code of that zip for faster startup
#
# Published on push (if that version is not released yet) or manually with "publish".

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish (overwrite) release android-engine-v<version>"
        type: boolean
        default: true
  push:
    branches: [SS14.Android]

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  NDK_VERSION: 27.2.12479018

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          submodules: true

      - uses: actions/setup-dotnet@v4.1.0
        with:
          dotnet-version: 10.0.x

      - name: Check release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP '(?<=<Version>)[^<]+' MSBuild/Robust.Engine.Version.props)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = push ] && gh release view "android-engine-v$VERSION" --json assets -q '.assets[].name' 2>/dev/null | grep -q aot; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "android-engine-v$VERSION already published"
          fi

      - name: Package engine
        if: steps.check.outputs.skip != 'true'
        run: Android/package-engine.sh release

      - name: Precompile (AOT)
        if: steps.check.outputs.skip != 'true'
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          eng="$RUNNER_TEMP/engine"; mkdir -p "$eng"
          unzip -q release/Robust.Client_android.zip -d "$eng"
          major=$(jq -r '.runtimeOptions.framework.version // (.runtimeOptions.frameworks[] | select(.name=="Microsoft.NETCore.App").version)' \
            "$eng/Robust.Client.runtimeconfig.json" | cut -d. -f1)
          ver=$(grep "^$major=" Android/runtime-versions.txt | cut -d= -f2)
          Android/aot-compile.sh "$ver" "$RUNNER_TEMP/aot" "$eng" -- "$eng"
          (cd "$RUNNER_TEMP/aot" && zip -q -9 "$GITHUB_WORKSPACE/release/Robust.Client_android-aot-arm64.zip" *.dll.so)

      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.skip != 'true'
        with:
          name: android-engine
          path: release/

      - name: Publish release
        if: steps.check.outputs.skip != 'true' && (github.event_name == 'push' || inputs.publish)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-engine-v${{ steps.check.outputs.version }}"
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" \
            --title "Android engine ${{ steps.check.outputs.version }}" --notes "Android build of the engine for the SS14.Android launcher."
          gh release upload "$TAG" --clobber release/Robust.Client_android.zip release/Robust.Client_android.zip.sha256 \
            release/Robust.Client_android-aot-arm64.zip
